          echo "Project tree:"; find $ROOT -type f | sort
      - name: Prepare signing keystore
        working-directory: android-app
        env:
          KS_B64: ${{ secrets.AURUM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > aurum.jks
            echo "Signing with the company key from repo secret."
          else
            keytool -genkeypair \
              -dname "CN=Aurum Spirit India Limited, O=Aurum Spirit India Limited, C=IN" \
              -alias aurum -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore aurum.jks -storepass aurum12345 -keypass aurum12345
            echo "No company key secret found - one-time key used."
          fi
      - name: Build signed release APK
        working-directory: android-app
        env:
          AURUM_STORE_PASS: ${{ secrets.AURUM_KEY_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          cp android-app/app/build/outputs/apk/release/*.apk out/AurumFieldVisit.apk
          ls -la out
      - name: Publish APK into the repo (served by GitHub Pages)
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          cp out/AurumFieldVisit.apk AurumFieldVisit.apk
          git add AurumFieldVisit.apk
          git commit -m 'Publish AurumFieldVisit.apk [skip ci]' || true
          git push || true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumFieldVisit-apk
          path: out/AurumFieldVisit.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fieldvisit-apk
          name: Aurum FieldVisit - Android app
          body: Signed APK for the salesman FieldVisit reporting app. Download onto an Android phone and install (allow "install unknown apps" when prompted).
          files: out/AurumFieldVisit.apk
